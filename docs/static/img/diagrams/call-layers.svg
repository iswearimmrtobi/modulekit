<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="var(--ifm-font-family-monospace)" role="img" aria-label="The host calls the adapter manager, which uses the core ModuleManager primitives, which use InjectionResolver and DependencyGraph.">
  <defs>
    <marker id="ar-call" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--mk-line)"/>
    </marker>
  </defs>

  <g stroke="var(--mk-line)" stroke-width="2" marker-end="url(#ar-call)">
    <line x1="360" y1="80" x2="360" y2="106"/>
    <line x1="360" y1="176" x2="360" y2="202"/>
  </g>

  <!-- Host -->
  <rect x="60" y="16" width="600" height="64" rx="10" fill="var(--mk-box-fill-2)" stroke="var(--mk-box-stroke)" stroke-width="1.5"/>
  <text x="80" y="41" font-size="14" font-weight="700" fill="var(--mk-text)">Host — your plugin / main()</text>
  <text x="80" y="62" font-size="12" fill="var(--mk-muted)">discover() &#183; runLoad() &#183; runEnable() &#183; runDisable()</text>

  <!-- ModuleManager -->
  <rect x="60" y="106" width="600" height="64" rx="10" fill="var(--mk-core-bg)" stroke="var(--mk-core)" stroke-width="1.5"/>
  <text x="80" y="131" font-size="14" font-weight="700" fill="var(--mk-core)">ModuleManager (core) — the adapter drives the phases</text>
  <text x="80" y="152" font-size="12" fill="var(--mk-muted)">runAction(...) forward &#183; runActionReversed(...) reverse</text>

  <!-- engine -->
  <rect x="60" y="202" width="600" height="82" rx="10" fill="var(--mk-box-fill-2)" stroke="var(--mk-box-stroke)" stroke-width="1.5"/>
  <text x="80" y="228" font-size="13" font-weight="700" fill="var(--mk-text)">InjectionResolver</text>
  <text x="270" y="228" font-size="12" fill="var(--mk-muted)">constructs each module</text>
  <text x="80" y="256" font-size="13" font-weight="700" fill="var(--mk-text)">DependencyGraph</text>
  <text x="270" y="256" font-size="12" fill="var(--mk-muted)">computes load order + faults</text>
  <text x="80" y="276" font-size="11" fill="var(--mk-muted)">ServiceLoaderDiscovery &#183; TopologicalSort &#183; ModuleContext</text>
</svg>
