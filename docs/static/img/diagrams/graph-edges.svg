<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" font-family="var(--ifm-font-family-monospace)" role="img" aria-label="reporting requires DatabaseService and AuthService, so it is ordered after the database and auth modules that provide them.">
  <defs>
    <marker id="ar-graph" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--mk-core)"/>
    </marker>
  </defs>

  <!-- edges: providers down to reporting -->
  <g stroke="var(--mk-core)" stroke-width="2" marker-end="url(#ar-graph)" fill="none">
    <line x1="150" y1="76" x2="270" y2="162"/>
    <line x1="450" y1="76" x2="330" y2="162"/>
  </g>

  <!-- provider nodes -->
  <rect x="75" y="24" width="150" height="52" rx="10" fill="var(--mk-core-bg)" stroke="var(--mk-core)" stroke-width="1.5"/>
  <text x="150" y="47" text-anchor="middle" font-size="14" font-weight="700" fill="var(--mk-text)">database</text>
  <text x="150" y="65" text-anchor="middle" font-size="10.5" fill="var(--mk-muted)">provides</text>

  <rect x="375" y="24" width="150" height="52" rx="10" fill="var(--mk-core-bg)" stroke="var(--mk-core)" stroke-width="1.5"/>
  <text x="450" y="47" text-anchor="middle" font-size="14" font-weight="700" fill="var(--mk-text)">auth</text>
  <text x="450" y="65" text-anchor="middle" font-size="10.5" fill="var(--mk-muted)">provides</text>

  <!-- edge type labels -->
  <g font-size="11" fill="var(--mk-muted)">
    <text x="150" y="120" text-anchor="middle">DatabaseService</text>
    <text x="452" y="120" text-anchor="middle">AuthService</text>
  </g>

  <!-- consumer node -->
  <rect x="225" y="162" width="150" height="52" rx="10" fill="var(--mk-box-fill-2)" stroke="var(--mk-accent)" stroke-width="1.8"/>
  <text x="300" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="var(--mk-accent)">reporting</text>
  <text x="300" y="203" text-anchor="middle" font-size="10.5" fill="var(--mk-muted)">requires both &#8594; loads last</text>
</svg>
