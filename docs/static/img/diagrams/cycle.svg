<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 190" font-family="var(--ifm-font-family-monospace)" role="img" aria-label="Module A requires B and B requires A, forming a cycle; neither reaches in-degree zero, so both are marked faulty.">
  <defs>
    <marker id="ar-cyc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--mk-faulty)"/>
    </marker>
  </defs>

  <!-- cyclic arrows -->
  <g stroke="var(--mk-faulty)" stroke-width="2" fill="none" marker-end="url(#ar-cyc)">
    <path d="M190,66 C240,36 280,36 328,64"/>
    <path d="M330,104 C280,134 240,134 192,106"/>
  </g>
  <g font-size="11" fill="var(--mk-muted)" text-anchor="middle">
    <text x="260" y="34">requires</text>
    <text x="260" y="152">requires</text>
  </g>

  <!-- nodes -->
  <circle cx="150" cy="85" r="34" fill="var(--mk-faulty-bg)" stroke="var(--mk-faulty)" stroke-width="1.8"/>
  <text x="150" y="91" text-anchor="middle" font-size="18" font-weight="700" fill="var(--mk-faulty)">A</text>
  <circle cx="370" cy="85" r="34" fill="var(--mk-faulty-bg)" stroke="var(--mk-faulty)" stroke-width="1.8"/>
  <text x="370" y="91" text-anchor="middle" font-size="18" font-weight="700" fill="var(--mk-faulty)">B</text>

  <text x="260" y="185" text-anchor="middle" font-size="11" fill="var(--mk-muted)">neither reaches in-degree 0 &#8594; both marked FAULTY</text>
</svg>
