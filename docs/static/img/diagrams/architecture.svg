<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="var(--ifm-font-family-monospace)" role="img" aria-label="ModuleKit architecture: modulekit-api is implemented by modulekit-core, which is subclassed by the paper and minestom adapters.">
  <defs>
    <marker id="ar-arch" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--mk-line)"/>
    </marker>
  </defs>

  <!-- connectors -->
  <g stroke="var(--mk-line)" stroke-width="2" fill="none">
    <line x1="360" y1="72" x2="360" y2="102" marker-end="url(#ar-arch)"/>
    <path d="M360,162 L360,200 M240,200 L480,200 M240,200 L240,230 M480,200 L480,230"/>
    <line x1="240" y1="200" x2="240" y2="230" marker-end="url(#ar-arch)"/>
    <line x1="480" y1="200" x2="480" y2="230" marker-end="url(#ar-arch)"/>
  </g>

  <!-- api -->
  <rect x="170" y="14" width="380" height="58" rx="10" fill="var(--mk-api-bg)" stroke="var(--mk-api)" stroke-width="1.5"/>
  <text x="360" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="var(--mk-api)">modulekit-api</text>
  <text x="360" y="59" text-anchor="middle" font-size="11" fill="var(--mk-muted)">the contract &#183; Module &#183; ModuleDescriptor &#183; LoadContext</text>

  <!-- core -->
  <rect x="170" y="104" width="380" height="58" rx="10" fill="var(--mk-core-bg)" stroke="var(--mk-core)" stroke-width="1.5"/>
  <text x="360" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="var(--mk-core)">modulekit-core</text>
  <text x="360" y="149" text-anchor="middle" font-size="11" fill="var(--mk-muted)">the engine &#183; discovery &#183; graph &#183; sort &#183; injection</text>

  <!-- adapters -->
  <rect x="140" y="230" width="200" height="58" rx="10" fill="var(--mk-adapter-bg)" stroke="var(--mk-adapter)" stroke-width="1.5"/>
  <text x="240" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="var(--mk-adapter)">modulekit-paper</text>
  <text x="240" y="274" text-anchor="middle" font-size="11" fill="var(--mk-muted)">Paper / Bukkit</text>

  <rect x="380" y="230" width="200" height="58" rx="10" fill="var(--mk-adapter-bg)" stroke="var(--mk-adapter)" stroke-width="1.5"/>
  <text x="480" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="var(--mk-adapter)">modulekit-minestom</text>
  <text x="480" y="274" text-anchor="middle" font-size="11" fill="var(--mk-muted)">Minestom</text>

  <!-- edge labels -->
  <g font-size="11" fill="var(--mk-muted)">
    <text x="372" y="92">implemented by</text>
    <text x="372" y="196">subclassed by</text>
  </g>
</svg>
