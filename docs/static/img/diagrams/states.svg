<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 328" font-family="var(--ifm-font-family-monospace)" role="img" aria-label="Paper states go DISABLED to LOADED to ENABLED; Minestom states go DISABLED to INITIALIZED; both can divert to a terminal FAULTY state.">
  <defs>
    <marker id="ar-state" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--mk-line)"/>
    </marker>
    <marker id="ar-state-f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--mk-faulty)"/>
    </marker>
  </defs>

  <!-- ============ Paper ============ -->
  <text x="24" y="30" font-size="12" font-weight="700" fill="var(--mk-muted)">PaperModuleState</text>

  <g stroke="var(--mk-line)" stroke-width="2" marker-end="url(#ar-state)">
    <line x1="282" y1="64" x2="316" y2="64"/>
    <line x1="450" y1="64" x2="484" y2="64"/>
  </g>
  <line x1="384" y1="82" x2="384" y2="108" stroke="var(--mk-faulty)" stroke-width="1.8" stroke-dasharray="3 4" marker-end="url(#ar-state-f)"/>
  <text x="398" y="103" font-size="10.5" fill="var(--mk-muted)">any phase</text>

  <g font-size="12.5" font-weight="700" text-anchor="middle">
    <rect x="150" y="46" width="132" height="36" rx="18" fill="var(--mk-disabled-bg)" stroke="var(--mk-disabled)" stroke-width="1.5"/>
    <text x="216" y="69" fill="var(--mk-disabled)">DISABLED</text>
    <rect x="318" y="46" width="132" height="36" rx="18" fill="var(--mk-loaded-bg)" stroke="var(--mk-loaded)" stroke-width="1.5"/>
    <text x="384" y="69" fill="var(--mk-loaded)">LOADED</text>
    <rect x="486" y="46" width="132" height="36" rx="18" fill="var(--mk-enabled-bg)" stroke="var(--mk-enabled)" stroke-width="1.5"/>
    <text x="552" y="69" fill="var(--mk-enabled)">ENABLED</text>
    <rect x="318" y="110" width="132" height="36" rx="18" fill="var(--mk-faulty-bg)" stroke="var(--mk-faulty)" stroke-width="1.5"/>
    <text x="384" y="133" fill="var(--mk-faulty)">FAULTY</text>
  </g>
  <text x="462" y="133" font-size="10.5" fill="var(--mk-muted)">terminal</text>

  <line x1="40" y1="176" x2="680" y2="176" stroke="var(--mk-box-stroke)" stroke-width="1"/>

  <!-- ============ Minestom ============ -->
  <text x="24" y="202" font-size="12" font-weight="700" fill="var(--mk-muted)">MinestomModuleState</text>

  <line x1="282" y1="236" x2="316" y2="236" stroke="var(--mk-line)" stroke-width="2" marker-end="url(#ar-state)"/>
  <line x1="216" y1="254" x2="216" y2="280" stroke="var(--mk-faulty)" stroke-width="1.8" stroke-dasharray="3 4" marker-end="url(#ar-state-f)"/>

  <g font-size="12.5" font-weight="700" text-anchor="middle">
    <rect x="150" y="218" width="132" height="36" rx="18" fill="var(--mk-disabled-bg)" stroke="var(--mk-disabled)" stroke-width="1.5"/>
    <text x="216" y="241" fill="var(--mk-disabled)">DISABLED</text>
    <rect x="318" y="218" width="160" height="36" rx="18" fill="var(--mk-loaded-bg)" stroke="var(--mk-loaded)" stroke-width="1.5"/>
    <text x="398" y="241" fill="var(--mk-loaded)">INITIALIZED</text>
    <rect x="150" y="282" width="132" height="36" rx="18" fill="var(--mk-faulty-bg)" stroke="var(--mk-faulty)" stroke-width="1.5"/>
    <text x="216" y="305" fill="var(--mk-faulty)">FAULTY</text>
  </g>
</svg>
