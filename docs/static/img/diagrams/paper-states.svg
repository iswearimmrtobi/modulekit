<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" font-family="var(--ifm-font-family-monospace)" role="img" aria-label="A Paper module toggles between DISABLED and ENABLED via loadAndEnableModule and disableModule, and any phase can divert to a terminal FAULTY state.">
  <defs>
    <marker id="ar-pstate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--mk-line)"/>
    </marker>
    <marker id="ar-pstate-f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--mk-faulty)"/>
    </marker>
  </defs>

  <!-- toggle arrows -->
  <line x1="212" y1="84" x2="428" y2="84" stroke="var(--mk-line)" stroke-width="2" marker-end="url(#ar-pstate)"/>
  <line x1="428" y1="96" x2="212" y2="96" stroke="var(--mk-line)" stroke-width="2" marker-end="url(#ar-pstate)"/>
  <text x="320" y="62" text-anchor="middle" font-size="11" fill="var(--mk-enabled)">loadAndEnableModule / runLoad + runEnable</text>
  <text x="320" y="130" text-anchor="middle" font-size="11" fill="var(--mk-muted)">disableModule / runDisable</text>

  <!-- faulty dotted -->
  <g stroke="var(--mk-faulty)" stroke-width="1.8" stroke-dasharray="3 4" fill="none" marker-end="url(#ar-pstate-f)">
    <line x1="135" y1="110" x2="286" y2="156"/>
    <line x1="505" y1="110" x2="354" y2="156"/>
  </g>

  <!-- pills -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="60" y="70" width="150" height="40" rx="20" fill="var(--mk-disabled-bg)" stroke="var(--mk-disabled)" stroke-width="1.5"/>
    <text x="135" y="95" fill="var(--mk-disabled)">DISABLED</text>
    <rect x="430" y="70" width="150" height="40" rx="20" fill="var(--mk-enabled-bg)" stroke="var(--mk-enabled)" stroke-width="1.5"/>
    <text x="505" y="95" fill="var(--mk-enabled)">ENABLED</text>
    <rect x="245" y="158" width="150" height="40" rx="20" fill="var(--mk-faulty-bg)" stroke="var(--mk-faulty)" stroke-width="1.5"/>
    <text x="320" y="183" fill="var(--mk-faulty)">FAULTY</text>
  </g>
  <text x="320" y="215" text-anchor="middle" font-size="10.5" fill="var(--mk-muted)">any phase &#8594; FAULTY (terminal; retry with loadAndEnableModule)</text>
</svg>
